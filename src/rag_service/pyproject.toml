[project]
name = "rag-service"
version = "0.1.0"
description = "Retrieval and grounded answering service for the fictional support assistant"
requires-python = "==3.12.*"
dependencies = [
    "anyio>=4.15.1",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "openai>=3.24.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The service is an application, not an installed package; tests import `app` from here.
pythonpath = ["."]
# Default runs stay offline; real-model checks run explicitly with `uv run pytest -m model`.
addopts = "-m 'not model'"
markers = ["model: needs the real embedding model (downloaded once into MODEL_CACHE_DIR)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
